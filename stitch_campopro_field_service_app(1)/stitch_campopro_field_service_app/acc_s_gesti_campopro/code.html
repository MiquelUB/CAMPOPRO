<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-base text-on-surface flex items-center justify-center min-h-screen"><main class="w-full"><div class="flex flex-col w-full">

<div class="fixed inset-0 z-0 bg-gradient-to-br from-primary-container to-on-primary-fixed overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px] animate-pulse"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] rounded-full bg-secondary/10 blur-[100px]" style="animation: pulse 8s infinite alternate;"></div>
<!-- Subtle Grid Overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 flex flex-col items-center justify-center min-h-[90vh] px-md">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest/95 backdrop-blur-sm shadow-xl rounded-xl overflow-hidden p-xl border-t border-white/10">
<!-- Branding -->
<div class="flex flex-col items-center mb-xl">
<div class="w-24 h-24 mb-md drop-shadow-md transform transition-transform hover:scale-105 duration-500">
<img alt="CampoPro Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsEXFuQ4rmmM6G9GiP2Wc1vF-mvbIxAj1gCebc33OvQEY7pafglJcHcVF_69XfQ1M8JO4wJAGm547Zj0L19kbIe10YNOcBQmYBueHpTMNBGCnoXSQ_alln7Z5WFWt5-Cn97yJ9ffWW7LBpeIOnWV8-8x8PXbHS-fNYeuGaX55ts_6UD_U6P0o4YF6hNTWbkFh-qoGbwhbYw1ZCycoonB_94NWgX5mSb5y8Pa65DRzMGc9oydmf8LpzkT7I"/>
</div>
<h1 class="font-section-title text-section-title text-on-surface tracking-tight text-center">
          Accés Gestió CampoPro
        </h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-xs text-center">
          Introduïu les vostres credencials per continuar
        </p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="loginForm">
<!-- Field Group: Credentials -->
<div class="space-y-md">
<div class="group">
<label class="block font-label-caps text-label-caps text-outline mb-xs uppercase tracking-widest">Correu Electrònic</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-base text-body-base focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/5 transition-all" placeholder="nom@campopro.cat" required="" type="email"/>
</div>
</div>
<div class="group">
<label class="block font-label-caps text-label-caps text-outline mb-xs uppercase tracking-widest">Contrasenya</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-base text-body-base focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/5 transition-all" id="passwordInput" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passIcon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Field Group: 2FA -->
<div class="pt-sm border-t border-surface-container-highest">
<div class="flex justify-between items-center mb-sm">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Codi 2FA (Sis dígits)</label>
<span class="material-symbols-outlined text-secondary text-[18px]" title="Seguretat Requerida">verified_user</span>
</div>
<div class="flex justify-between gap-2" id="otp-container">
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center text-display-lg font-display-lg bg-surface-container border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-all" maxlength="1" type="text"/>
</div>
</div>
<!-- Actions -->
<div class="space-y-md pt-sm">
<button class="w-full bg-secondary-container hover:bg-secondary text-on-secondary-container hover:text-white py-4 rounded-lg font-body-strong text-body-strong shadow-lg shadow-secondary/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
            Entrar a la Plataforma
            <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<div class="text-center">
<a class="font-body-base text-body-base text-primary hover:text-secondary-container transition-colors underline-offset-4 hover:underline decoration-secondary-container/30" href="#">
              Has oblidat la contrasenya?
            </a>
</div>
</div>
</form>
</div>
<!-- Security Footer -->
<div class="mt-xl flex flex-col items-center gap-2 opacity-80">
<div class="flex items-center gap-sm bg-on-primary-fixed/30 backdrop-blur-md px-md py-sm rounded-full border border-white/5 shadow-sm">
<span class="material-symbols-outlined text-white text-[16px]">shield</span>
<span class="font-label-caps text-label-caps text-white uppercase tracking-widest">Plataforma segura</span>
<span class="w-1 h-1 rounded-full bg-white/30"></span>
<span class="font-label-caps text-label-caps text-white uppercase tracking-widest flex items-center gap-1">
          Dades a UE <span class="text-[14px] leading-none">🇪🇺</span>
</span>
</div>
<p class="font-label-caps text-[10px] text-white/50 uppercase tracking-[0.2em] mt-xs">CampoPro ERP v4.2.0 • Field Service Management</p>
</div>
</div>
<script>
    // Password Toggle Functionality
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('passIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        input.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // OTP Auto-focus and handling
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    // Form Animation
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Carregant...';
      btn.disabled = true;
      
      // Simulate login delay
      setTimeout(() => {
        window.location.reload();
      }, 1500);
    });
  </script>
<style>
    @keyframes pulse {
      from { transform: scale(1) translate(0, 0); opacity: 0.15; }
      to { transform: scale(1.1) translate(20px, 10px); opacity: 0.25; }
    }
    
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #eeedf1 inset;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</div></main></body></html>
