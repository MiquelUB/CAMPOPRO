version: '3.8'

services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DATABASE_URL=postgresql+asyncpg://postgres:default@db:5432/campopro
      - REDIS_URL=redis://redis:6379/0
    secrets:
      - db_password
    networks:
      - internal_net
      - proxy_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build: ../backend
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DATABASE_URL=postgresql+asyncpg://postgres:default@db:5432/campopro
      - REDIS_URL=redis://redis:6379/0
    secrets:
      - db_password
    networks:
      - internal_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ../backend
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DATABASE_URL=postgresql+asyncpg://postgres:default@db:5432/campopro
      - REDIS_URL=redis://redis:6379/0
    secrets:
      - db_password
    networks:
      - internal_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=campopro
    secrets:
      - db_password
    networks:
      - internal_net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ../pwa
    restart: unless-stopped
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - proxy_net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  internal_net:
    internal: true
  proxy_net:

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
