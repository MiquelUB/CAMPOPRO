# /etc/nginx/conf.d/superadmin.conf

# Proxy rules for superadmin
# Assumes superadmin is accessed via a specific domain or path
# For instance, a subdomain superadmin.campopro.com or path /superadmin/

server {
    listen 80;
    server_name superadmin.campopro.local;

    # Apply rate limiting
    limit_req zone=mylimit burst=20 nodelay;

    # IP Allowlist for Super Admin
    # Replace these with real IPs in production
    allow 127.0.0.1;
    allow 192.168.1.0/24;
    allow 10.0.0.0/8;
    # Add your trusted VPN or Office IP here
    deny all;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/superadmin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
